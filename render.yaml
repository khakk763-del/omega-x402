# OMEGA x402 — Render Blueprint (CANONICAL copy; Render reads render.yaml
# from the repository root, and the repo root for this deploy is
# income_assets/). A mirror lives in x402_service/render.yaml.
# Build context is income_assets/ itself: the Dockerfile copies
# x402_service/ and opportunity_intelligence/ from here.
services:
  - type: web
    name: omega-x402
    runtime: docker
    plan: free
    dockerfilePath: ./x402_service/Dockerfile
    dockerContext: .
    healthCheckPath: /health
    envVars:
      - key: OMEGA_PAY_TO
        value: 0xCF3388dB231300f88285351154FbC17098A01bD2
      - key: OMEGA_X402_NETWORK
        value: eip155:8453
      - key: OMEGA_X402_FACILITATOR_URL
        value: https://facilitator.payai.network
      # Phase 2 (CDP facilitator): set BOTH values in the Render dashboard
      # (sync: false = managed in dashboard, never committed to git).
      # When both are present the app uses the CDP Facilitator
      # (https://api.cdp.coinbase.com/platform/v2/x402) instead of PayAI.
      # CDP_API_KEY_SECRET is a SECRET: Khalid pastes it in the dashboard
      # himself from his Secure Vault copy — never in chat, never in git.
      - key: CDP_API_KEY_ID
        sync: false
      - key: CDP_API_KEY_SECRET
        sync: false
